name: Unity + Python CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-python:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Pull code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install dependencies for Mediapipe
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mediapipe opencv-python

      # Step 4: Run your Mediapipe script
      - name: Run gesture recognition script
        run: python "Assets/Scripts/gesture_recognition.py"